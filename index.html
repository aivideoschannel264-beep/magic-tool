<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bff3ee">
<title>Magic Tool</title>
<style>
:root{
  --ink:#0f3b43; --ink-soft:#3d6a72; --glass:rgba(255,255,255,.42); --glass-strong:rgba(255,255,255,.62);
  --edge:rgba(255,255,255,.75); --shadow:0 10px 30px rgba(24,120,130,.18);
  --ok:#12805c; --err:#c0392b; --warn:#9a6700;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  min-height:100%; font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; color:var(--ink);
  background:linear-gradient(135deg,#d8fbf6 0%,#b6f0ee 38%,#bfe3fb 72%,#e3f6ff 100%) fixed;
  padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  display:flex;justify-content:center;overflow-x:hidden;
}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(60px);z-index:0;pointer-events:none}
body::before{width:260px;height:260px;background:rgba(120,230,220,.55);top:-60px;left:-60px}
body::after{width:300px;height:300px;background:rgba(150,200,255,.5);bottom:-80px;right:-80px}
.app{position:relative;z-index:1;width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px}
.glass{
  background:var(--glass);border:1px solid var(--edge);border-radius:22px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
}
header{text-align:center;padding:22px 16px 6px}
.logo{
  width:96px;height:96px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,#fff 0%,#9eeee6 45%,#4fc3d9 100%);
  border:3px solid #fff;box-shadow:0 8px 24px rgba(40,160,180,.35),inset 0 -6px 14px rgba(20,120,150,.25);
}
.logo svg{width:50px;height:50px}
h1{font-size:2rem;letter-spacing:.3px;font-weight:800;color:var(--ink)}
.sub{margin-top:4px;color:var(--ink-soft);font-size:.95rem}
section{padding:16px}
h2{font-size:1.02rem;font-weight:700;margin-bottom:10px}
.abi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{
  border:1px solid var(--edge);background:var(--glass-strong);border-radius:16px;padding:12px;text-align:left;
  font:inherit;color:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s;
}
.chip:active{transform:scale(.97)}
.chip b{display:block;font-size:1.05rem}
.chip span{display:block;font-size:.8rem;color:var(--ink-soft);margin-top:2px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:16px 10px;
  border-radius:20px;border:1px solid var(--edge);background:var(--glass-strong);color:var(--ink);
  font:inherit;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s;
}
.card:active{transform:scale(.97)}
.card .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff}
.card .ic svg{width:24px;height:24px}
.card strong{font-size:.98rem}
.card small{font-size:.78rem;color:var(--ink-soft)}
.support{display:flex;flex-direction:row;text-align:left;gap:14px;width:100%;padding:14px 16px}
.support .txt{flex:1}
.i-support{background:linear-gradient(135deg,#2ec4b6,#3a86ff)}
.i-buy{background:linear-gradient(135deg,#ff9f43,#ff5e7e)}
.i-wa{background:linear-gradient(135deg,#25d366,#128c7e)}
label{display:block;font-weight:600;margin-bottom:8px;font-size:.95rem}
.field{position:relative}
input{
  width:100%;padding:15px 74px 15px 16px;font:inherit;font-size:1rem;letter-spacing:1px;color:var(--ink);
  background:rgba(255,255,255,.75);border:1.5px solid var(--edge);border-radius:16px;outline:none;text-transform:uppercase;
}
input::placeholder{color:#7fa3a9;letter-spacing:1px}
input:focus{border-color:#2ec4b6;box-shadow:0 0 0 4px rgba(46,196,182,.25)}
.paste{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;border-radius:11px;padding:8px 12px;
  background:rgba(46,196,182,.18);color:var(--ink);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;
}
.verify{
  margin-top:14px;width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-size:1.08rem;font-weight:800;color:#fff;
  background:linear-gradient(120deg,#ff5e7e,#ff9f43 35%,#2ec4b6 70%,#3a86ff);background-size:200% 100%;
  box-shadow:0 10px 22px rgba(58,134,255,.32);cursor:pointer;transition:background-position .6s,transform .15s;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.verify:hover{background-position:100% 0}
.verify:active{transform:scale(.98)}
.verify:disabled{opacity:.7;cursor:wait}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;display:none}
.verify.busy .spin{display:block}
@keyframes s{to{transform:rotate(360deg)}}
.status{margin-top:12px;padding:11px 14px;border-radius:14px;font-size:.92rem;display:none;line-height:1.4}
.status.show{display:block}
.status.ok{background:rgba(18,128,92,.14);color:var(--ok)}
.status.err{background:rgba(192,57,43,.13);color:var(--err)}
.status.warn{background:rgba(154,103,0,.14);color:var(--warn)}
footer{text-align:center;font-size:.8rem;color:var(--ink-soft);padding:4px 0 6px}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;
  background:rgba(15,59,67,.92);color:#fff;padding:11px 18px;border-radius:14px;font-size:.9rem;max-width:90%;
  transition:.25s;z-index:10;pointer-events:none;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:3px solid #3a86ff;outline-offset:2px}
@media (max-width:360px){h1{font-size:1.7rem}.cards{gap:8px}.card{padding:14px 6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app">
  <header class="glass">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0f3b43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 15 9"/><path d="m13 7 4 4"/><path d="M18 3v3M16.5 4.5h3M6 5v2M5 6h2M20 14v2M19 15h2"/></svg>
    </div>
    <h1>Magic Tool</h1>
    <p class="sub">Activate your license to unlock every feature</p>
  </header>

  <section class="glass" aria-labelledby="abi-h">
    <h2 id="abi-h">CPU ABI support</h2>
    <div class="abi">
      <button class="chip" data-abi="armeabi-v7a"><b>32-bit</b><span>armeabi-v7a</span></button>
      <button class="chip" data-abi="arm64-v8a"><b>64-bit</b><span>arm64-v8a</span></button>
    </div>
  </section>

  <button class="card support glass" id="btnSupport" type="button">
    <span class="ic i-support"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg></span>
    <span class="txt"><strong>Chat with Support</strong><br><small>Get help with setup or your key</small></span>
  </button>

  <div class="cards">
    <button class="card" id="btnBuy" type="button">
      <span class="ic i-buy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.2-8.2M16 7l3 3M14 9l2 2"/></svg></span>
      <strong>Purchase Key</strong><small>Buy a new license</small>
    </button>
    <button class="card" id="btnWa" type="button">
      <span class="ic i-wa"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.2 14c-.2.6-1.300 1.200-1.800 1.200-.5.1-1 .2-3.300-.7-2.800-1.100-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800 0-1.400.7-2 1-2.300.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.400 0 .5l-.4.600-.3.400c-.1.200-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.100 1 2 1.300 2.300 1.400.3.100.5.100.6-.1l.9-1.100c.2-.3.400-.2.600-.1l1.900.9c.3.100.5.200.5.300.1.200.1.800-.1 1.400Z"/></svg></span>
      <strong>WhatsApp</strong><small>Message us directly</small>
    </button>
  </div>

  <section class="glass" aria-labelledby="key-h">
    <h2 id="key-h">Activate license</h2>
    <label for="licenseKey">License Key</label>
    <div class="field">
      <input id="licenseKey" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="XXXX-XXXX-XXXX-XXXX">
      <button class="paste" id="btnPaste" type="button">Paste</button>
    </div>
    <button class="verify" id="btnVerify" type="button"><span class="spin"></span><span id="verifyLabel">Verify Key</span></button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>

  <footer>&copy; <span id="yr"></span> Magic Tool. All rights reserved.</footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
const CONFIG = window.APP_CONFIG || {};

const $ = id => document.getElementById(id);
const input = $("licenseKey"), statusBox = $("status"), verifyBtn = $("btnVerify");
$("yr").textContent = new Date().getFullYear();

let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}
function setStatus(type, msg){
  statusBox.className = "status show " + type; statusBox.textContent = msg;
}
function openLink(url, label){
  if(!url){ toast(label + " link is not configured yet."); return; }
  window.open(url, "_blank", "noopener,noreferrer");
}

/* ABI chips: tap to copy */
document.querySelectorAll(".chip").forEach(chip=>{
  chip.addEventListener("click", async ()=>{
    const abi = chip.dataset.abi;
    try{ await navigator.clipboard.writeText(abi); toast("Copied " + abi); }
    catch{ toast(abi); }
  });
});

$("btnSupport").addEventListener("click", ()=>openLink(CONFIG.supportUrl, "Support"));
$("btnBuy").addEventListener("click", ()=>{
  const n=(CONFIG.whatsappNumber||"").replace(/\D/g,"");
  if(!n){toast("WhatsApp number is not configured yet.");return;}
  openLink("https://wa.me/"+n+"?text="+encodeURIComponent(CONFIG.purchaseMessage||""),"Purchase");
});
$("btnWa").addEventListener("click", ()=>openLink(CONFIG.channelUrl, "WhatsApp channel"));

/* Paste button */
$("btnPaste").addEventListener("click", async ()=>{
  try{
    const text = await navigator.clipboard.readText();
    input.value = formatKey(text); input.focus(); statusBox.className = "status";
  }catch{ toast("Clipboard access was blocked. Paste the key manually."); input.focus(); }
});

/* Key formatting: uppercase letters/digits, grouped in fours */
function formatKey(v){
  const clean = v.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,16);
  return clean.replace(/(.{4})(?=.)/g,"$1-");
}
input.addEventListener("input", ()=>{ input.value = formatKey(input.value); statusBox.className = "status"; });
input.addEventListener("keydown", e=>{ if(e.key === "Enter") verify(); });

/* Verification: never marks a key valid unless the backend says so */
async function verify(){
  const key = input.value.trim();
  if(key.replace(/-/g,"").length !== 16){ setStatus("err","Enter the full 16-character license key."); input.focus(); return; }
  const endpoint = CONFIG.supabaseUrl ? CONFIG.supabaseUrl.replace(/\/$/,"") + "/functions/v1/verify-license" : "";
  if(!endpoint || !CONFIG.supabaseAnonKey){
    setStatus("warn","Verification is not available yet because no backend is connected. Your key was not checked.");
    return;
  }
  verifyBtn.disabled = true; verifyBtn.classList.add("busy"); $("verifyLabel").textContent = "Verifying…";
  const ctrl = new AbortController(); const timer = setTimeout(()=>ctrl.abort(), CONFIG.requestTimeoutMs);
  try{
    const res = await fetch(endpoint, {
      method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json","apikey":CONFIG.supabaseAnonKey},
      body: JSON.stringify({ key }), signal: ctrl.signal, credentials:"omit"
    });
    if(!res.ok && res.status!==429) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if(data && data.valid === true) setStatus("ok", data.message || "License verified.");
    else setStatus("err", (data && data.message) || "This license key is not valid.");
  }catch(err){
    setStatus("err", err.name === "AbortError" ? "The server took too long to respond. Try again." : "Could not reach the verification server. Check your connection and try again.");
  }finally{
    clearTimeout(timer); verifyBtn.disabled = false; verifyBtn.classList.remove("busy"); $("verifyLabel").textContent = "Verify Key";
  }
}
verifyBtn.addEventListener("click", verify);
</script>
</body>
</html>
